---
# =============================================================
# Build MegaLinter Custom Flavor Workflow
#
# This workflow builds and publishes a custom MegaLinter Docker image
# to GitHub Container Registry (ghcr.io) and optionally Docker Hub.
#
# Usage:
# - Triggers on push, release, or manual dispatch.
# - Tags the image with the release tag (on release) or 'alpha' (otherwise).
# - Pushes to ghcr.io and, if credentials are set, to Docker Hub.
#
# Required repository secrets:
#   - GITHUB_TOKEN: Provided by GitHub Actions (for ghcr.io push)
#   - DOCKERHUB_USERNAME: (optional) Docker Hub username for push
#   - DOCKERHUB_PASSWORD: (optional) Docker Hub password/token for push
#
# Optional repository variables:
#   - DOCKERHUB_REPO: Docker Hub repository name (e.g. nvuillam)
#
# The MegaLinter custom flavor image will be available at:
#   - ghcr.io/<owner>/<repo>/megalinter-custom-flavor:<tag>
#   - docker.io/<dockerhub_repo>/<repo>:<tag> (if Docker Hub credentials are set)
# =============================================================
name: Build & Push MegaLinter Custom Flavor

on:
  push:
    branches-ignore: [main]
  release:
    types: [edited, published]
  workflow_dispatch:
    inputs:
      megalinter-version:
        description: "MegaLinter version to build (e.g., v7.5.0)"
        required: false
        type: string
      is-latest:
        description: "Mark this version as latest"
        required: false
        type: boolean
        default: false
      # LOCAL TWEAK (re-apply after `npx mega-linter-runner --custom-flavor-setup`):
      # Publish an interim release built on a pre-release builder base, so a linter
      # that has merged upstream but is not yet in a stable vX.Y.0 image can be used
      # now. See README "Interim release on a pre-release base".
      release-version:
        description: "Semver tag to publish under and create as a git tag for Dependabot (e.g. v10.0.1). Empty = no tag created."
        required: false
        type: string
      builder-base:
        description: "Builder base image tag to build against (e.g. beta). Empty = use the resolved version tag."
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-custom-flavor:
    name: Build Custom MegaLinter Flavor
    runs-on: ubuntu-latest
    permissions:
      # contents: write (not read) so the interim-release step can push a git tag
      # for Dependabot. LOCAL TWEAK — resets to `read` on --custom-flavor-setup.
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine MegaLinter Version Tag
        id: determine-tag
        env:
          INPUT_MEGALINTER_VERSION: ${{ inputs.megalinter-version }}
          INPUT_IS_LATEST: ${{ inputs.is-latest }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          # LOCAL TWEAK inputs (see workflow_dispatch above / README).
          INPUT_RELEASE_VERSION: ${{ inputs.release-version }}
          INPUT_BUILDER_BASE: ${{ inputs.builder-base }}
        run: |
          if [ -n "${INPUT_RELEASE_VERSION}" ]; then
            TAG="${INPUT_RELEASE_VERSION}"
            echo "Using release-version input: $TAG"
          elif [ -n "${INPUT_MEGALINTER_VERSION}" ]; then
            TAG="${INPUT_MEGALINTER_VERSION}"
            echo "Using workflow input version: $TAG"
          elif [ "${EVENT_NAME}" == "release" ]; then
            TAG="${RELEASE_TAG}"
            echo "Using release tag: $TAG"
          else
            TAG="beta"
            echo "Using default tag: $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          # LOCAL TWEAK: builder base image the flavor is built on. Defaults to the
          # published version tag (TAG); builder-base lets an interim semver release
          # build on a pre-release base (e.g. beta) without changing the published
          # image's version.
          if [ -n "${INPUT_BUILDER_BASE}" ]; then
            BUILDER_TAG="${INPUT_BUILDER_BASE}"
            echo "Using builder base override: $BUILDER_TAG (publishing as $TAG)"
          else
            BUILDER_TAG="${TAG}"
          fi
          echo "builder_tag=$BUILDER_TAG" >> "$GITHUB_OUTPUT"

          # Determine is-latest flag
          if [ "${EVENT_NAME}" == "workflow_dispatch" ]; then
            IS_LATEST="${INPUT_IS_LATEST}"
            echo "Using workflow input is-latest: $IS_LATEST"
          elif [ "${EVENT_NAME}" == "release" ]; then
            IS_LATEST="true"
            echo "Release event - is-latest: true"
          else
            IS_LATEST="false"
            echo "Default is-latest: false"
          fi
          echo "is-latest=$IS_LATEST" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Log in to Docker Hub only if credentials are provided
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
        continue-on-error: true

      - name: Set Lowercase Repository Name
        id: lowercase-repo
        run: echo "repo=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build MegaLinter Custom Flavor
        uses: oxsecurity/megalinter/flavors/custom-builder@main
        with:
          # LOCAL TWEAK: base image = builder_tag (may differ from published tag).
          megalinter-custom-flavor-builder-tag: ${{ steps.determine-tag.outputs.builder_tag }}
          platform: "linux/amd64"
          is-latest: ${{ steps.determine-tag.outputs.is-latest }}
          upload-to-ghcr: "true"
          upload-to-dockerhub: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_PASSWORD != '' && 'true' || 'false' }}
          dockerhub-repo: ${{ vars.DOCKERHUB_REPO }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOM_FLAVOR_BUILD_REPO: ${{ steps.lowercase-repo.outputs.repo }}
          CUSTOM_FLAVOR_BUILD_REPO_URL: ${{ github.repositoryUrl }}
          CUSTOM_FLAVOR_BUILD_USER: ${{ github.actor }}

      # LOCAL TWEAK (re-apply after `npx mega-linter-runner --custom-flavor-setup`):
      # The custom-builder derives the PUBLISHED image tag from the built image's
      # version label, which inherits from the base image (builder_tag) — so with a
      # builder-base override it publishes under the base's tag (e.g. `beta`), not
      # release-version. Re-tag the just-built image so it is also available under
      # release-version. Only runs when the two differ (i.e. an override was used).
      - name: Re-tag published image as release-version
        if: ${{ success() && inputs.release-version != '' && steps.determine-tag.outputs.builder_tag != inputs.release-version }}
        env:
          REPO: ${{ steps.lowercase-repo.outputs.repo }}
          SRC_TAG: ${{ steps.determine-tag.outputs.builder_tag }}
          REL: ${{ inputs.release-version }}
        run: |
          IMG="ghcr.io/${REPO}/megalinter-custom-flavor"
          echo "Re-tagging ${IMG}:${SRC_TAG} -> ${IMG}:${REL}"
          docker buildx imagetools create --tag "${IMG}:${REL}" "${IMG}:${SRC_TAG}"
          echo "Published ${IMG}:${REL}"

      # LOCAL TWEAK (re-apply after `npx mega-linter-runner --custom-flavor-setup`):
      # When release-version is supplied on a manual dispatch, create a git tag so
      # Dependabot (github-actions) sees this version in consumer repos.
      #
      # The tag points at a SIDE COMMIT (not on main) whose action.yml image is
      # pinned to :release-version. Reason: the generated action.yml hardcodes
      # :latest (mega-linter-runner sets it unconditionally), so `uses: ...@<tag>`
      # would otherwise pull :latest, not the image built for this release. main
      # deliberately keeps :latest for @main users; only this tagged commit is
      # pinned. The side commit is made locally and never pushed as a branch —
      # only the tag ref is pushed, so main is untouched.
      #
      # Creating a tag ref (not a GitHub Release) does NOT emit a `release` event,
      # so the `on: release` trigger above is not re-fired (no double build).
      - name: Create git tag for Dependabot (interim release)
        if: ${{ success() && inputs.release-version != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ steps.lowercase-repo.outputs.repo }}
          REL: ${{ inputs.release-version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${REL}" >/dev/null 2>&1; then
            echo "Tag ${REL} already exists; skipping tag creation."
            exit 0
          fi

          IMG="ghcr.io/${REPO}/megalinter-custom-flavor"

          # Pin action.yml's image tag to :release-version (replace whatever tag
          # suffix is on the image reference — do not assume it is `latest`).
          sed -E -i "s|(${IMG}):[A-Za-z0-9._-]+|\1:${REL}|" action.yml
          if ! grep -q "${IMG}:${REL}" action.yml; then
            echo "::error::Failed to pin action.yml image to ${IMG}:${REL}"
            exit 1
          fi
          echo "Pinned action.yml image -> ${IMG}:${REL}"

          # Commit locally (a side commit; the branch is never pushed) and tag it.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add action.yml
          git commit -m "release ${REL}: pin action.yml image to :${REL}"
          git tag -a "${REL}" -m "Custom flavor ${REL} (image pinned to :${REL})"

          # Push ONLY the tag ref, authenticated via the token in an extraheader
          # (checkout used persist-credentials:false). main is not pushed.
          AUTH=$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH}" \
            push "https://github.com/${REPO}.git" "refs/tags/${REL}"
          echo "Pushed tag ${REL} (action.yml pinned; main untouched; no release event emitted)."
